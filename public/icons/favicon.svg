<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with brand gradient -->
  <rect width="400" height="400" rx="40" ry="40" fill="url(#brandGradient)" />

  <!-- Main RR text - perfectly centered -->
  <text x="195" y="280" font-family="serif" font-size="250" font-weight="300" text-anchor="middle" dominant-baseline="central" fill="white" letter-spacing="8px">RR</text>
</svg>
