name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4
        with:
          version: 1.18.2
      - name: Check both packages in the locked Flox environment
        run: |
          flox activate -- bash -euc '
            npm ci
            npm --prefix sanity-studio ci
            npm run build
            npm run sanity:build
            actionlint
          '
      - name: Start the local site and Studio containers
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Build Sanity Studio in its container
        run: docker compose exec -T studio npm run build
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local containers
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: dist/
          retention-days: 7
